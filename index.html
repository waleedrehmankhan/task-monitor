<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scheduler Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f3ef;
    --surface: #ffffff;
    --surface2: #eeede9;
    --border: #e0dfd9;
    --text-primary: #1a1916;
    --text-secondary: #6b6a64;
    --text-muted: #9e9d97;
    --green-bg: #e8f2da; --green-text: #2e5a0e; --green-bar: #4e8a1a;
    --yellow-bg: #fef3d8; --yellow-text: #7a4f00; --yellow-bar: #c98a00;
    --red-bg: #fde8e8; --red-text: #7a1a1a; --red-bar: #c93030;
    --gray-bg: #eeede9; --gray-text: #5a5a54; --gray-bar: #a0a098;
    --radius: 10px;
    --radius-sm: 6px;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    padding: 0;
  }

  /* Header */
  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 16px 28px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-icon {
    width: 36px; height: 36px; background: var(--text-primary);
    border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
  }
  .header-icon svg { width: 18px; height: 18px; fill: none; stroke: white; stroke-width: 1.5; }
  .header-title { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
  .header-sub { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-top: 1px; }
  .header-right { display: flex; align-items: center; gap: 10px; }

  .demo-badge {
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em;
    background: #fff3cd; color: #7a4f00; border: 1px solid #f0c05a;
    padding: 3px 10px; border-radius: 20px;
  }

  .refresh-btn {
    display: flex; align-items: center; gap: 6px;
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    color: var(--text-secondary); background: var(--surface2);
    border: 1px solid var(--border); border-radius: var(--radius-sm);
    padding: 6px 12px; cursor: pointer; transition: all 0.15s;
  }
  .refresh-btn:hover { background: var(--border); color: var(--text-primary); }
  .refresh-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; }
  .refresh-btn.spinning svg { animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .last-updated { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; }

  /* Main */
  .main { padding: 20px 28px; }

  /* Summary bar */
  .summary-bar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px; margin-bottom: 18px;
  }
  .summary-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    position: relative; overflow: hidden;
  }
  .summary-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  }
  .summary-card.green::before { background: var(--green-bar); }
  .summary-card.yellow::before { background: var(--yellow-bar); }
  .summary-card.red::before { background: var(--red-bar); }
  .summary-card.gray::before { background: var(--gray-bar); }
  .summary-num { font-size: 28px; font-weight: 300; letter-spacing: -0.04em; line-height: 1; margin-bottom: 4px; }
  .summary-card.green .summary-num { color: var(--green-text); }
  .summary-card.yellow .summary-num { color: var(--yellow-text); }
  .summary-card.red .summary-num { color: var(--red-text); }
  .summary-card.gray .summary-num { color: var(--gray-text); }
  .summary-label { font-size: 11px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.06em; }

  /* Controls */
  .controls {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .filter-group { display: flex; gap: 4px; }
  .filter-btn {
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--border); background: transparent;
    color: var(--text-secondary); cursor: pointer; transition: all 0.15s;
  }
  .filter-btn:hover { background: var(--surface2); }
  .filter-btn.active { background: var(--text-primary); color: white; border-color: var(--text-primary); }
  .filter-btn.active.green { background: var(--green-bar); border-color: var(--green-bar); }
  .filter-btn.active.yellow { background: var(--yellow-bar); border-color: var(--yellow-bar); }
  .filter-btn.active.red { background: var(--red-bar); border-color: var(--red-bar); }
  .search-wrap { margin-left: auto; position: relative; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; stroke: var(--text-muted); fill: none; stroke-width: 2; pointer-events: none; }
  .search-input {
    font-family: 'DM Sans', sans-serif; font-size: 13px;
    padding: 6px 12px 6px 30px; border-radius: 20px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-primary); outline: none; width: 200px; transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--text-secondary); }
  .results-count { font-size: 11px; color: var(--text-muted); font-family: 'DM Mono', monospace; white-space: nowrap; }

  /* Grid */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 10px; }

  /* Tile */
  .tile {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    position: relative; overflow: hidden; cursor: default;
    transition: transform 0.15s, box-shadow 0.15s;
    animation: fadeIn 0.3s ease both;
  }
  .tile:hover { transform: translateY(-2px); box-shadow: 0 4px 16px rgba(0,0,0,0.07); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  .tile-bar { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
  .tile-bar.green { background: var(--green-bar); }
  .tile-bar.yellow { background: var(--yellow-bar); }
  .tile-bar.red { background: var(--red-bar); }
  .tile-bar.gray { background: var(--gray-bar); }
  .tile-name {
    font-size: 13px; font-weight: 600; letter-spacing: -0.01em;
    color: var(--text-primary); margin-top: 4px; margin-bottom: 8px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tile-badge {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em;
    padding: 3px 8px; border-radius: 20px; margin-bottom: 10px;
  }
  .tile-badge .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
  .badge-green { background: var(--green-bg); color: var(--green-text); }
  .badge-green .dot { background: var(--green-bar); }
  .badge-yellow { background: var(--yellow-bg); color: var(--yellow-text); }
  .badge-yellow .dot { background: var(--yellow-bar); }
  .badge-red { background: var(--red-bg); color: var(--red-text); }
  .badge-red .dot { background: var(--red-bar); }
  .badge-gray { background: var(--gray-bg); color: var(--gray-text); }
  .badge-gray .dot { background: var(--gray-bar); }
  .tile-divider { height: 1px; background: var(--border); margin-bottom: 8px; }
  .tile-row { display: flex; align-items: flex-start; gap: 6px; margin-bottom: 4px; }
  .tile-row-label { font-size: 10px; color: var(--text-muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; min-width: 36px; margin-top: 1px; }
  .tile-row-val { font-size: 11px; color: var(--text-secondary); font-family: 'DM Mono', monospace; line-height: 1.4; word-break: break-all; }
  .tile-subject-val { font-size: 11px; color: var(--text-secondary); line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }

  /* Pulse for red */
  .tile.status-red .tile-bar { animation: pulse-red 2s ease-in-out infinite; }
  @keyframes pulse-red { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* Error / empty */
  .state-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 48px 24px; text-align: center; grid-column: 1/-1;
  }
  .state-icon { font-size: 32px; margin-bottom: 12px; }
  .state-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .state-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }

  /* Legend */
  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-secondary); }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>
<body>

<div class="header">
  <div class="header-left">
    <div class="header-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </div>
    <div>
      <div class="header-title">Scheduler Monitor</div>
      <div class="header-sub" id="env-count">Loading environments...</div>
    </div>
  </div>
  <div class="header-right">
    <span class="demo-badge">Demo Mode</span>
    <span class="last-updated" id="last-updated">—</span>
    <button class="refresh-btn" id="refresh-btn" onclick="loadData()">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      Refresh
    </button>
  </div>
</div>

<div class="main">
  <div class="summary-bar">
    <div class="summary-card green"><div class="summary-num" id="cnt-green">—</div><div class="summary-label">Completed</div></div>
    <div class="summary-card yellow"><div class="summary-num" id="cnt-yellow">—</div><div class="summary-label">Delayed</div></div>
    <div class="summary-card red"><div class="summary-num" id="cnt-red">—</div><div class="summary-label">Failed / No signal</div></div>
    <div class="summary-card gray"><div class="summary-num" id="cnt-gray">—</div><div class="summary-label">No data yet</div></div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--green-bar)"></div>Email received today, completed</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--yellow-bar)"></div>Last email 4–6h ago (delayed)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--red-bar)"></div>No email since midnight or FAILED</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--gray-bar)"></div>No emails recorded yet</div>
  </div>

  <div class="controls">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">All</button>
      <button class="filter-btn green" data-filter="green" onclick="setFilter('green',this)">Completed</button>
      <button class="filter-btn yellow" data-filter="yellow" onclick="setFilter('yellow',this)">Delayed</button>
      <button class="filter-btn red" data-filter="red" onclick="setFilter('red',this)">Failed</button>
    </div>
    <span class="results-count" id="results-count"></span>
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" type="text" placeholder="Search environment..." oninput="setSearch(this.value)" />
    </div>
  </div>

  <div class="grid" id="tile-grid"></div>
</div>

<script>
  // ─── DEMO DATA ────────────────────────────────────────────────────────────
  // Timestamps are generated relative to "now" so statuses always look realistic.
  // Green  = received recently (< 4h ago)
  // Yellow = received 4–6h ago
  // Red    = HasFailed=Yes OR received before midnight
  // Gray   = no email at all

  function hoursAgo(h) {
    return new Date(Date.now() - h * 3600000).toISOString();
  }
  function minutesAgo(m) {
    return new Date(Date.now() - m * 60000).toISOString();
  }

  const DEMO_DATA = [
    // ── Green (completed today, recent) ──────────────────────────────────────
    {
      EnvironmentName: "Bidfood NZ",
      SenderEmail: "slim4server@bidfood.co.nz",
      ReceivedDateTime: minutesAgo(22),
      Subject: "SCHEDULED TASK COMPLETED : 11:30am Batch Export",
      HasFailed: "No"
    },
    {
      EnvironmentName: "AS Watson SG",
      SenderEmail: "slim4serverSG@aswatson.com",
      ReceivedDateTime: minutesAgo(48),
      Subject: "SCHEDULED TASK COMPLETED : Daily Calculations",
      HasFailed: "No"
    },
    {
      EnvironmentName: "Lotte Mart KR",
      SenderEmail: "slim4@lottemart.co.kr",
      ReceivedDateTime: hoursAgo(1),
      Subject: "SCHEDULED TASK COMPLETED : Nightly Stock Sync",
      HasFailed: "No"
    },
    {
      EnvironmentName: "Metro AG DE",
      SenderEmail: "slim4server@metro.de",
      ReceivedDateTime: hoursAgo(2),
      Subject: "SCHEDULED TASK COMPLETED : Promotion Import",
      HasFailed: "No"
    },
    {
      EnvironmentName: "Woolworths AU",
      SenderEmail: "slim4@woolworths.com.au",
      ReceivedDateTime: hoursAgo(1.5),
      Subject: "SCHEDULED TASK COMPLETED : Daily Replenishment",
      HasFailed: "No"
    },
    {
      EnvironmentName: "Pick n Pay ZA",
      SenderEmail: "slim4server@pnp.co.za",
      ReceivedDateTime: minutesAgo(65),
      Subject: "SCHEDULED TASK COMPLETED : Sales Data Export",
      HasFailed: "No"
    },
    {
      EnvironmentName: "NTUC Fairprice SG",
      SenderEmail: "slim4@fairprice.com.sg",
      ReceivedDateTime: hoursAgo(3),
      Subject: "SCHEDULED TASK COMPLETED : Basket Analysis",
      HasFailed: "No"
    },

    // ── Yellow (delayed — 4–6h ago) ───────────────────────────────────────────
    {
      EnvironmentName: "Bidfood SG",
      SenderEmail: "slim4server@bidfood.com.sg",
      ReceivedDateTime: hoursAgo(4.5),
      Subject: "SCHEDULED TASK COMPLETED : Daily Import",
      HasFailed: "No"
    },
    {
      EnvironmentName: "Giant MY",
      SenderEmail: "slim4@giant.com.my",
      ReceivedDateTime: hoursAgo(5.2),
      Subject: "SCHEDULED TASK COMPLETED : Weekly Ranging",
      HasFailed: "No"
    },

    // ── Red (failed or no signal) ─────────────────────────────────────────────
    {
      EnvironmentName: "Garuda Food ID",
      SenderEmail: "gita@garudafood.co.id",
      ReceivedDateTime: hoursAgo(8),
      Subject: "SCHEDULED TASK FAILED : Daily Import",
      HasFailed: "Yes"
    },
    {
      EnvironmentName: "Carrefour SA",
      SenderEmail: "slim4@carrefoursa.com",
      ReceivedDateTime: hoursAgo(9),
      Subject: "SCHEDULED TASK FAILED : Nightly Calculations **WITH WARNINGS**",
      HasFailed: "Yes"
    },
    {
      EnvironmentName: "Shoprite ZA",
      SenderEmail: "slim4server@shoprite.co.za",
      ReceivedDateTime: hoursAgo(7),
      Subject: "SCHEDULED TASK FAILED : Promo Export **WITH DO NOT RUN TASK**",
      HasFailed: "Yes"
    },

    // ── Gray (no email at all) ────────────────────────────────────────────────
    {
      EnvironmentName: "Spar NL",
      SenderEmail: "slim4@spar.nl",
      ReceivedDateTime: null,
      Subject: null,
      HasFailed: "No"
    },
    {
      EnvironmentName: "IGA AU",
      SenderEmail: "slim4server@iga.com.au",
      ReceivedDateTime: null,
      Subject: null,
      HasFailed: "No"
    }
  ];
  // ──────────────────────────────────────────────────────────────────────────

  // Status thresholds (hours)
  const YELLOW_HOURS = 4;
  const RED_HOURS    = 6;

  let allEnvs = [];
  let currentFilter = 'all';
  let currentSearch = '';

  function getStatus(row) {
    if (!row.ReceivedDateTime) return 'gray';
    if (row.HasFailed === 'Yes') return 'red';
    const now      = new Date();
    const received = new Date(row.ReceivedDateTime);
    const midnight = new Date(now); midnight.setHours(0,0,0,0);
    if (received < midnight) return 'red';
    const hoursAgo = (now - received) / 3600000;
    if (hoursAgo >= RED_HOURS)    return 'red';
    if (hoursAgo >= YELLOW_HOURS) return 'yellow';
    return 'green';
  }

  function statusLabel(s) {
    return { green: 'Completed', yellow: 'Delayed', red: 'Failed', gray: 'No data' }[s];
  }

  function formatTime(iso) {
    if (!iso) return 'No email today';
    const d    = new Date(iso);
    const diff = Math.round((Date.now() - d) / 60000);
    if (diff < 1)  return 'Just now';
    if (diff < 60) return diff + 'm ago';
    const h = Math.floor(diff / 60), m = diff % 60;
    return h + 'h' + (m > 0 ? ' ' + m + 'm' : '') + ' ago';
  }

  function cleanSubject(s) {
    if (!s) return '';
    return s
      .replace('SCHEDULED TASK COMPLETED :', '')
      .replace('SCHEDULED TASK COMPLETED:', '')
      .replace('**WITH WARNINGS**', '⚠ With warnings')
      .replace('**WITH DO NOT RUN TASK**', '⛔ Do not run')
      .replace('SCHEDULED TASK FAILED :', '⚠ FAILED:')
      .replace('SCHEDULED TASK FAILED:', '⚠ FAILED:')
      .trim();
  }

  function loadData() {
    const btn = document.getElementById('refresh-btn');
    btn.classList.add('spinning');
    document.getElementById('last-updated').textContent = 'Refreshing...';

    // Simulate a short load delay for realism
    setTimeout(() => {
      const order = { red: 0, yellow: 1, green: 2, gray: 3 };
      allEnvs = DEMO_DATA.map(row => ({
        ...row,
        displayName: row.EnvironmentName || row.SenderEmail || 'Unknown'
      })).sort((a, b) => {
        const sd = order[getStatus(a)] - order[getStatus(b)];
        return sd !== 0 ? sd : a.displayName.localeCompare(b.displayName);
      });

      updateSummary();
      renderTiles();
      document.getElementById('last-updated').textContent = 'Updated ' + new Date().toLocaleTimeString();
      document.getElementById('env-count').textContent = allEnvs.length + ' environments tracked';
      btn.classList.remove('spinning');
    }, 500);
  }

  function updateSummary() {
    const counts = { green: 0, yellow: 0, red: 0, gray: 0 };
    allEnvs.forEach(e => counts[getStatus(e)]++);
    ['green','yellow','red','gray'].forEach(s => {
      document.getElementById('cnt-' + s).textContent = counts[s];
    });
  }

  function renderTiles() {
    const filtered = allEnvs.filter(e => {
      const matchFilter = currentFilter === 'all' || getStatus(e) === currentFilter;
      const matchSearch = e.displayName.toLowerCase().includes(currentSearch.toLowerCase());
      return matchFilter && matchSearch;
    });

    document.getElementById('results-count').textContent =
      filtered.length + ' of ' + allEnvs.length;

    if (filtered.length === 0) {
      document.getElementById('tile-grid').innerHTML = `
        <div class="state-box">
          <div class="state-icon">🔍</div>
          <div class="state-title">No environments match</div>
          <div class="state-desc">Try a different filter or search term.</div>
        </div>`;
      return;
    }

    document.getElementById('tile-grid').innerHTML = filtered.map((e, i) => {
      const s    = getStatus(e);
      const subj = cleanSubject(e.Subject);
      return `
        <div class="tile status-${s}" style="animation-delay:${Math.min(i * 0.03, 0.5)}s" title="${e.SenderEmail || ''}">
          <div class="tile-bar ${s}"></div>
          <div class="tile-name">${escHtml(e.displayName)}</div>
          <span class="tile-badge badge-${s}"><span class="dot"></span>${statusLabel(s)}</span>
          <div class="tile-divider"></div>
          <div class="tile-row">
            <span class="tile-row-label">Time</span>
            <span class="tile-row-val">${formatTime(e.ReceivedDateTime)}</span>
          </div>
          ${subj ? `<div class="tile-row">
            <span class="tile-row-label">Task</span>
            <span class="tile-subject-val">${escHtml(subj)}</span>
          </div>` : ''}
        </div>`;
    }).join('');
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTiles();
  }

  function setSearch(v) { currentSearch = v; renderTiles(); }

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // Init
  loadData();
</script>
</body>
</html>
